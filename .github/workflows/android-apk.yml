# Builds the Android app (Capacitor shell around the live site) and uploads
# the APK as a downloadable artifact. Run it from Actions → "Android APK" →
# Run workflow, or it runs on pushes to main that touch the app shell.
#
# Setup (repo Settings → Secrets and variables → Actions):
#   Variable CAP_SERVER_URL            live App Hosting URL (https://…hosted.app)
#   Secret   GOOGLE_SERVICES_JSON      contents of google-services.json (Firebase → Android app)
#   Secret   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   Secret   ANDROID_KEYSTORE_PASSWORD
#   Secret   ANDROID_KEY_ALIAS
#   Secret   ANDROID_KEY_PASSWORD
# Without the keystore secrets it builds a debug APK, which works for a test
# but won't install as an update over a different build.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Check the live URL is set
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then
            echo "::error::Set the CAP_SERVER_URL repository variable to the live app URL."
            exit 1
          fi

      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo "::warning::No google-services.json — the app will build but push notifications won't work."
          fi

      - name: Sync the app shell
        env:
          CAP_SERVER_URL: ${{ vars.CAP_SERVER_URL }}
        run: npx cap sync android

      - name: Release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "APK_TYPE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secrets — building a debug APK."
            echo "APK_TYPE=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$APK_TYPE" = release ]; then ./gradlew assembleRelease; else ./gradlew assembleDebug; fi

      - uses: actions/upload-artifact@v4
        with:
          name: aaromach-android-${{ env.APK_TYPE }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/${{ env.APK_TYPE }}/*.apk
          if-no-files-found: error
