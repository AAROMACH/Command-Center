# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  region: us-east4
  maxInstances: 1
env:
  # Firebase Cloud Messaging Web Push certificate (public key) — web push on
  # the iPhone Home Screen app and browsers (src/lib/web-push.ts).
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BMtW548UDPTPgC_jJd682KaYJfU0by3Ej9O9fRMGm3mDOSbWbKoKtI2nT8EPn3-TpM_pb56rnkelabmAXz_CrjQ
    availability:
      - BUILD
      - RUNTIME

  # QuickBooks Online (src/lib/server/quickbooks.ts). Both keys live in
  # Secret Manager; the App Hosting compute account has Secret Accessor.
  - variable: QBO_CLIENT_ID
    secret: QBO_CLIENT_ID
    availability:
      - RUNTIME
  - variable: QBO_CLIENT_SECRET
    secret: QBO_CLIENT_SECRET
    availability:
      - RUNTIME
  # 'production' = the real company file; anything else uses the Intuit sandbox.
  - variable: QBO_ENV
    value: production
    availability:
      - RUNTIME

  # In-app help assistant (src/app/api/assistant). Key lives in Secret Manager.
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME
